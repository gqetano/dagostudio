<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="DAGOSTUDIO — fotografia contemporanea di matrimonio." />
  <title>DAGOSTUDIO — Anteprima home 14 — margini logo mobile</title>
  <style>
    :root {
      --carmine: #FF0000;
      --logo: #e7e7e7;
      --gap: 6px;
      --pad: clamp(9px, 1.1vw, 17px);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: #000; }
    html { overscroll-behavior: none; }
    body { overflow: hidden; font-family: Arial, Helvetica, sans-serif; }
    button { font: inherit; }
    .scene { position: fixed; inset: 0; width: 100%; height: 100dvh; overflow: hidden; background: #000; isolation: isolate; touch-action: none; }
    /* V08: prevent fast carousel clicks selecting the page. Reversible via
       DISABLE_CAROUSEL_TEXT_SELECTION (below); future selectable content can
       opt back in with .allow-text-selection. */
    .scene.no-accidental-selection { -webkit-user-select: none; user-select: none; }
    .scene.no-accidental-selection .allow-text-selection { -webkit-user-select: text; user-select: text; }

    .photos { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
    .photo { position: absolute; inset: 0; display: none; overflow: hidden; }
    .photo.active { display: block; }
    .photo img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center center; pointer-events: none; }
    /* The original mark remains in view even when the introduction is finished. */
    .mark {
      position: absolute; z-index: 2;
      top: 0; left: 1.15%;
      width: 97.7%; height: 100%;
      overflow: visible; color: var(--logo); pointer-events: none;
    }
    .glyph { will-change: transform; }
    .interface {
      position: fixed; z-index: 5; inset: 0;
      display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); grid-template-rows: auto 1fr;
      column-gap: var(--gap); padding:
        calc(var(--pad) + env(safe-area-inset-top, 0px))
        calc(var(--pad) + env(safe-area-inset-right, 0px))
        calc(var(--pad) + env(safe-area-inset-bottom, 0px))
        calc(var(--pad) + env(safe-area-inset-left, 0px));
      pointer-events: none;
    }
    .cross, .circle { width: clamp(36px,5.8vw,78px); height: clamp(36px,5.8vw,78px); position: relative; }
    .cross { grid-column: 1; grid-row: 1; }
    .cross::before,.cross::after { content:""; position:absolute; background:var(--carmine); }
    .cross::before { width:1.5px; height:100%; left:50%; top:0; transform: translateX(-50%); }
    .cross::after { height:1.5px; width:100%; left:0; top:50%; transform: translateY(-50%); }
    .circle { grid-column:5; grid-row:1; justify-self:end; border:1.5px solid var(--carmine); border-radius:50%; }
    /* One custom full-size arrow follows the mouse; no persistent bottom controls. */
    .cursor-arrow {
      position: fixed; left: 0; top: 0; z-index: 20;
      width: clamp(36px, 5.8vw, 78px); height: clamp(36px, 5.8vw, 78px);
      pointer-events: none; visibility: hidden; transform: translate(-50%, -50%);
      color: var(--carmine);
    }
    .cursor-arrow svg { display: block; width: 100%; height: 100%; }
    .cursor-arrow path {
      fill: none; stroke: currentColor; stroke-width: 1.5;
      vector-effect: non-scaling-stroke; stroke-linecap: square; stroke-linejoin: miter;
    }
    .cursor-arrow[data-direction="left"] svg { transform: scaleX(-1); }
    /* V10: compact client-facing intro comparison. No other site controls changed. */
    .version-switch {
      position: fixed; z-index: 30;
      right: calc(var(--pad) + env(safe-area-inset-right, 0px));
      top: 50%; bottom: auto;
      transform: translateY(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      pointer-events: auto;
    }
    .version-btn {
      appearance: none; background: transparent; color: var(--carmine);
      border: 1.5px solid var(--carmine); border-radius: 0;
      display: grid; place-items: center;
      width: clamp(42px, 4.5vw, 58px); height: clamp(42px, 4.5vw, 58px);
      padding: 0; margin: 0;
      font: 700 clamp(13px, 1.3vw, 17px)/1 Arial, Helvetica, sans-serif;
      letter-spacing: -.04em; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none; user-select: none;
    }
    .version-btn[aria-pressed="true"] { background: var(--carmine); color: #000; }
    .version-btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

    /* V11 — Instagram-style time rail: one thin segment per photograph, hard-cut carousel. */
    .slide-progress {
      position: fixed; z-index: 16;
      top: auto; bottom: calc(7px + env(safe-area-inset-bottom, 0px));
      left: calc(var(--pad) + env(safe-area-inset-left, 0px));
      right: calc(var(--pad) + env(safe-area-inset-right, 0px));
      display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 5px;
      height: 20px; align-items: center; pointer-events: auto;
    }
    .slide-progress button {
      display: block; appearance: none; border: 0; background: transparent;
      margin: 0; padding: 0; height: 20px; width: 100%;
      cursor: pointer; touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .slide-progress .progress-track {
      display: block; position: relative; overflow: hidden;
      width: 100%; height: 1.5px; background: rgba(255, 0, 0, .36);
    }
    .slide-progress .progress-fill {
      position: absolute; inset: 0; background: var(--carmine);
      transform-origin: left center; transform: scaleX(0); will-change: transform;
    }
    .slide-progress button:focus-visible { outline: 1px solid white; outline-offset: 3px; }
    @media (max-width: 680px) {
      /* Mobile-only: logo against upper edge, the two pictograms anchored below. */
      .mark { top: 0; left: 0; width: 100%; }
      .interface { grid-template-rows: 1fr auto; }
      .cross, .circle { grid-row: 2; }
      .cross { justify-self: start; }
      .circle { justify-self: end; }
      /* Client comparison controls run down the right-hand edge, halfway up. */
      .version-switch {
        top: 50%; bottom: auto; right: calc(var(--pad) + env(safe-area-inset-right, 0px));
        transform: translateY(-50%); flex-direction: column;
      }
      /* V12: mobile retains the V11 story rail ABOVE. Desktop alone moves it below. */
      .slide-progress {
        top: calc(7px + env(safe-area-inset-top, 0px));
        bottom: auto; gap: 3px;
      }
    }
    @media (hover: hover) and (pointer: fine) { .scene { cursor: none; } }
    .visually-hidden { position:absolute!important;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap; }
    @media (max-width: 680px) {
      :root { --pad: 10px; --gap: 0px; }
      .interface { grid-template-columns: 1fr; }
      .cross,.circle { width: 41px; height: 41px; grid-column: 1; }
    }
    /* Last mobile overrides, after the original V10 mobile grid. */
    @media (max-width: 680px) {
      .interface { grid-template-rows: 1fr auto; }
      .cross,.circle { grid-row: 2; }
      .circle { justify-self: end; }
      /* V14 — MOBILE ONLY: align the logo's horizontal margins to the red
         controls (the same --pad + safe-area inset on either side), and put
         the composed lettering below the story-progress rail. Desktop untouched.
         Adjust MOBILE_LOGO_OFFSET in this CSS block if needed later. */
      .mark {
        --mobile-logo-offset: 24px;
        top: calc(var(--mobile-logo-offset) + env(safe-area-inset-top, 0px));
        left: calc(var(--pad) + env(safe-area-inset-left, 0px));
        width: calc(100% - (2 * var(--pad)) - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
      }
    }
    @media (prefers-reduced-motion: reduce) { .glyph { will-change: auto; } }
  </style>
</head>

  <script>
    (() => {
      'use strict';
      const scene = document.getElementById('scene');
      // V08: set to false to restore native double/triple-click text selection.
      const DISABLE_CAROUSEL_TEXT_SELECTION = true;
      if (DISABLE_CAROUSEL_TEXT_SELECTION) scene.classList.add('no-accidental-selection');
      scene.addEventListener('selectstart', (event) => {
        if (DISABLE_CAROUSEL_TEXT_SELECTION &&
            !event.target.closest('input, textarea, [contenteditable], .allow-text-selection')) {
          event.preventDefault();
        }
      });
      scene.addEventListener('dblclick', (event) => {
        if (DISABLE_CAROUSEL_TEXT_SELECTION &&
            !event.target.closest('input, textarea, [contenteditable], .allow-text-selection')) {
          event.preventDefault();
        }
      });

      const svg = document.getElementById('mark');
      const glyphs = Array.from(svg.querySelectorAll('.glyph'));
      const slides = Array.from(document.querySelectorAll('.photo'));
      const announcer = document.getElementById('slideAnnouncer');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
      const easing = t => 1 - Math.pow(1 - t, 2.3);
      let slideIndex = 0;
      // A single animation clock provides continuous story progress, but photographs
      // STILL change by a hard cut with no opacity/slide effects.
      let carouselFrame = 0;
      let slideStartedAt = 0;
      const interval = 5000;
      const progressSegments = Array.from(document.querySelectorAll('[data-slide-jump]'));
      const progressFills = progressSegments.map(button => button.querySelector('.progress-fill'));
      function updateSlideRail(fraction = 0) {
        progressFills.forEach((fill, i) => {
          const amount = i < slideIndex ? 1 : i === slideIndex ? clamp(fraction, 0, 1) : 0;
          fill.style.transform = `scaleX(${amount})`;
        });
        progressSegments.forEach((button, i) => {
          if (i === slideIndex) button.setAttribute('aria-current', 'true');
          else button.removeAttribute('aria-current');
        });
      }

      function setSlide(index, userInitiated = false) {
        const next = (index + slides.length) % slides.length;
        if (next === slideIndex) return;
        slides[slideIndex].classList.remove('active');
        slides[slideIndex].setAttribute('aria-hidden', 'true');
        slideIndex = next;
        slides[slideIndex].classList.add('active');
        slides[slideIndex].setAttribute('aria-hidden', 'false');
        if (userInitiated) {
          announcer.setAttribute('aria-live', 'polite');
          announcer.textContent = `Fotografia ${slideIndex + 1} di ${slides.length}`;
        } else {
          announcer.setAttribute('aria-live', 'off');
        }
        const nextImg = slides[(slideIndex + 1) % slides.length].querySelector('img');
        if (nextImg) nextImg.loading = 'eager';
      }
      function stopCarousel() { cancelAnimationFrame(carouselFrame); carouselFrame = 0; }
      function carouselTick(now) {
        if (document.hidden) { carouselFrame = 0; return; }
        const elapsed = now - slideStartedAt;
        if (elapsed >= interval) {
          setSlide(slideIndex + 1);
          slideStartedAt = now;
          updateSlideRail(0);
        } else {
          updateSlideRail(elapsed / interval);
        }
        carouselFrame = requestAnimationFrame(carouselTick);
      }
      function startCarousel() {
        if (carouselFrame || document.hidden) return;
        slideStartedAt = performance.now();
        updateSlideRail(0);
        carouselFrame = requestAnimationFrame(carouselTick);
      }
      function restartCarousel() { stopCarousel(); startCarousel(); }
      function changeSlide(dir) { setSlide(slideIndex + dir, true); restartCarousel(); }
      progressSegments.forEach(button => button.addEventListener('click', event => {
        event.stopPropagation();
        const index = Number(button.dataset.slideJump);
        setSlide(index, true);
        restartCarousel();
      }));
      const cursorArrow = document.getElementById('cursorArrow');
      const hasMouseCursor = window.matchMedia('(hover: hover) and (pointer: fine)');
      let lastSwipeAt = -1000;
      function updateCursor(e) {
        if (e.target.closest('.version-switch, .slide-progress') || !hasMouseCursor.matches || e.pointerType !== 'mouse') {
          cursorArrow.style.visibility = 'hidden';
          return;
        }
        cursorArrow.style.left = e.clientX + 'px';
        cursorArrow.style.top = e.clientY + 'px';
        cursorArrow.dataset.direction = e.clientX < window.innerWidth / 2 ? 'left' : 'right';
        cursorArrow.style.visibility = 'visible';
      }
      scene.addEventListener('pointermove', updateCursor);
      scene.addEventListener('pointerleave', () => { cursorArrow.style.visibility = 'hidden'; });
      scene.addEventListener('pointercancel', () => { cursorArrow.style.visibility = 'hidden'; });
      // Whole left or right half of the viewport is clickable, including on touch screens.
      scene.addEventListener('click', e => {
        if (e.detail === 0 || performance.now() - lastSwipeAt < 450) return;
        if (e.target.closest('button, a, .slide-progress')) return;
        changeSlide(e.clientX < window.innerWidth / 2 ? -1 : 1);
      });
      document.addEventListener('visibilitychange', () => document.hidden ? stopCarousel() : startCarousel());
      startCarousel();

      // Progressively compose letters vertically. Once composed, freeze permanently until reload.
      // Client-review V10: both intro styles survive in the same project.
      // 'scattered' = approved V08/V1 original, kept entirely unchanged.
      // 'grouped' = V10/V2: readable DAGO and STUDIO clusters, with broader
      // Y variation INSIDE each word and random placement of BOTH groups.
      // To remove the temporary client switch, hide .version-switch via CSS
      // and set DEFAULT_INTRO_VARIANT to the selected option.
      // V13 client preview defaults to V2+. V1 and V2 generators are retained intact.
      const DEFAULT_INTRO_VARIANT = 'grouped-plus';
      let introVariant = DEFAULT_INTRO_VARIANT;
      const GROUPED_LETTER_JITTER = 0.36; // V2 unchanged since V10.
      const GROUPED_PLUS_LETTER_JITTER = 0.82; // V2+ only: expressive vertical offsets, still within word clusters.
      let progress = reduceMotion ? 1 : 0;
      let completed = reduceMotion;
      let offsets = [];
      let baseY = 0;
      let viewportHeight = window.innerHeight;
      let raf = 0;
      let lastTouchX = null;
      let lastTouchY = null;
      let swipeX = 0;
      let swipeY = 0;
      // V11 touch physics: slow drags remain precise; a firm upward flick
      // finishes the logo with ease-out (slow settling, never a fade-out).
      let introMomentumFrame = 0;
      let touchSamples = [];
      const FLICK_VELOCITY = 0.62; // px / millisecond — tune mobile sensitivity here
      const FLICK_DISTANCE = 45; // px — ignore tiny incidental swipes
      function cancelIntroMomentum() {
        cancelAnimationFrame(introMomentumFrame);
        introMomentumFrame = 0;
      }
      function animateIntroTo(target, duration) {
        cancelIntroMomentum();
        if (completed) return;
        const from = progress;
        const start = performance.now();
        const to = clamp(target, 0, 1);
        function step(now) {
          const fraction = clamp((now - start) / duration, 0, 1);
          // Strong deceleration toward the end, like an inertial scroll settling.
          const eased = 1 - Math.pow(1 - fraction, 4);
          progress = from + (to - from) * eased;
          if (fraction >= 1) {
            progress = to;
            if (progress >= 1) { progress = 1; completed = true; }
          }
          renderMark();
          if (fraction < 1) introMomentumFrame = requestAnimationFrame(step);
          else introMomentumFrame = 0;
        }
        introMomentumFrame = requestAnimationFrame(step);
      }
      const delays = [0, .045, .015, .065, .025, .055, .01, .07, .035, .005];

      function renderMark() {
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(() => {
          glyphs.forEach((glyph, i) => {
            const t = easing(clamp((progress - delays[i]) / (1 - delays[i]), 0, 1));
            glyph.setAttribute('transform', `translate(0 ${(baseY + offsets[i] * (1 - t)).toFixed(4)})`);
          });
        });
      }
      // V08 ORIGINAL INTRO - preserved, not changed. It can be reactivated in
      // one line by setting INTRO_VARIANT to 'scattered' above.
      function createScatteredOffsets(scale) {
        const top = Math.min(110, viewportHeight * .13);
        const bottom = Math.max(top + 40, viewportHeight - 12 * scale - 18);
        return glyphs.map(() => (top + Math.random() * (bottom - top)) / scale - baseY);
      }

      // V10 / V2: readable word clusters, more expressive than V09.
      // Both words may appear high, middle or low: STUDIO can be above DAGO.
      // Gentle word-wide tilt plus independent vertical drift breaks the rigid
      // stacks, without changing original glyph paths or horizontal kerning.
      function createGroupedOffsets(scale) {
        const letterHeight = 8.25 * scale;
        const jitter = letterHeight * GROUPED_LETTER_JITTER;
        const margin = Math.max(12, Math.min(32, viewportHeight * .035));
        const minTop = margin;
        const maxTop = Math.max(minTop, viewportHeight - letterHeight - margin);
        const anchorMin = Math.min(maxTop, minTop + jitter * .75);
        const anchorMax = Math.max(anchorMin, maxTop - jitter * .75);
        const span = anchorMax - anchorMin;
        // One random gap, one random ordering; neither word is pinned to a band.
        const minGap = Math.min(span * .70, Math.max(letterHeight * .8, viewportHeight * .16));
        const lower = anchorMin + Math.random() * Math.max(0, span - minGap);
        const upper = lower + minGap + Math.random() * Math.max(0, anchorMax - lower - minGap);
        const swap = Math.random() < .5;
        const wordAnchors = swap ? [upper, lower] : [lower, upper];
        const tilt = [(Math.random()*2-1)*jitter*1.2, (Math.random()*2-1)*jitter*1.2];
        return glyphs.map((glyph, i) => {
          const word = i < 4 ? 0 : 1;
          const indexInWord = word === 0 ? i : i - 4;
          const count = word === 0 ? 4 : 6;
          const fraction = indexInWord / (count - 1) - .5;
          const letterTop = clamp(
            wordAnchors[word] + fraction * tilt[word] + (Math.random()*2-1)*jitter*.62,
            minTop, maxTop
          );
          return letterTop / scale - baseY;
        });
      }

      // V13 / V2+ — separate EXTRA expressive generator; V1 and V2 stay untouched.
      // Always preserves the logo's original 10 paths, x positions and final kerning.
      // Each word uses a random shared Y anchor and an intentional distribution
      // of vertical displacements: at least one glyph goes clearly above and
      // another below its word anchor (so V2+ does not look static by chance).
      // All displacements are clamped to the visible viewport, on any screen.
      function createGroupedPlusOffsets(scale) {
        const letterHeight = 8.25 * scale;
        const maxJitter = letterHeight * GROUPED_PLUS_LETTER_JITTER;
        const margin = Math.max(12, Math.min(32, viewportHeight * .035));
        const minTop = margin;
        const maxTop = Math.max(minTop, viewportHeight - letterHeight - margin);
        const available = Math.max(0, maxTop - minTop);
        // Each word stays inside a shared vertical envelope (one distinct nucleus).
        const amplitude = Math.min(maxJitter * .82, available * .30);
        const anchorMin = minTop + amplitude;
        const anchorMax = Math.max(anchorMin, maxTop - amplitude);
        const anchorSpan = Math.max(0, anchorMax - anchorMin);
        // Place the two words at substantially different, random Y positions.
        // Their order can flip on every refresh. They are also separated by X.
        const minGap = Math.min(anchorSpan * .92, Math.max(letterHeight * .87, amplitude * 1.35));
        const first = anchorMin + Math.random() * Math.max(0, anchorSpan - minGap);
        const second = first + minGap + Math.random() * Math.max(0, anchorMax - first - minGap);
        const anchors = Math.random() < .5 ? [first, second] : [second, first];
        const output = Array(glyphs.length).fill(0);
        [[0,4],[4,6]].forEach(([start,count],word) => {
          // Spread levels and shuffle them: visible dynamism even on unlucky reloads.
          const levels = Array.from({length: count}, (_,j) => -1 + 2*j/(count-1));
          for (let j=count-1; j>0; j--) {
            const k = Math.floor(Math.random()*(j+1));
            [levels[j],levels[k]]=[levels[k],levels[j]];
          }
          // Secondary slope gives the word a visual direction, rather than rows.
          const slope = (Math.random()*2-1)*amplitude*.30;
          for (let j=0; j<count; j++) {
            const fraction = j/(count-1)-.5;
            const top = Math.max(minTop, Math.min(maxTop,
              anchors[word] + levels[j]*amplitude*.75
              + fraction*slope
              + (Math.random()*2-1)*amplitude*.08));
            output[start+j] = top / scale - baseY;
          }
        });
        return output;
      }

      function layout(regenerate) {
        const rect = svg.getBoundingClientRect();
        const scale = Math.max(1, rect.width) / 55.37;
        viewportHeight = Math.max(1, scene.getBoundingClientRect().height);
        svg.setAttribute('viewBox', `0 0 55.37 ${(viewportHeight / scale).toFixed(4)}`);
        // Restore the exact final height used in the earlier approved prototype.
        baseY = Math.min(4, Math.max(15, viewportHeight * .025) / scale);
        if (regenerate || offsets.length !== glyphs.length) {
          offsets = introVariant === 'grouped-plus'
            ? createGroupedPlusOffsets(scale)
            : introVariant === 'grouped'
              ? createGroupedOffsets(scale)
              : createScatteredOffsets(scale);
        }
        if (window.matchMedia('(max-width: 680px)').matches) {
          const svgTop = svg.getBoundingClientRect().top - scene.getBoundingClientRect().top;
          const bottomLimit = (viewportHeight - svgTop - 5) / scale - baseY;
          offsets = offsets.map((dy, i) => {
            const bounds = glyphs[i].getBBox();
            return Math.min(dy, bottomLimit - (bounds.y + bounds.height));
          });
        }
        renderMark();
      }
      // Choosing V1 / V2 / V2+ always restarts just the introduction; photographs,
      // cursor controls and all final logo geometry remain untouched.
      const versionButtons = Array.from(document.querySelectorAll('.version-btn'));
      function chooseIntroVariant(mode) {
        if (!['scattered', 'grouped', 'grouped-plus'].includes(mode)) return;
        introVariant = mode;
        cancelIntroMomentum();
        progress = reduceMotion ? 1 : 0;
        completed = reduceMotion;
        versionButtons.forEach(button =>
          button.setAttribute('aria-pressed', String(button.dataset.introMode === mode))
        );
        layout(true);
      }
      versionButtons.forEach(button => button.addEventListener('click', (event) => {
        event.stopPropagation();
        chooseIntroVariant(button.dataset.introMode);
      }));
      function changeProgress(delta) {
        if (completed) return;
        progress = clamp(progress + delta, 0, 1);
        if (progress >= 1) {
          progress = 1;
          completed = true;  // NO way back to the scattered intro by scrolling upwards.
        }
        renderMark();
      }
      function wheel(e) {
        if (!completed) {
          cancelIntroMomentum();
          e.preventDefault();
          const amount = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? viewportHeight : 1);
          changeProgress(amount / 310);
        }
      }
      scene.addEventListener('wheel', wheel, {passive: false});

      scene.addEventListener('touchstart', e => {
        if (e.touches.length !== 1 || e.target.closest('button, a, .slide-progress')) return;
        cancelIntroMomentum();
        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
        swipeX = 0; swipeY = 0;
        touchSamples = [{y:lastTouchY, t:performance.now()}];
      }, {passive:true});
      scene.addEventListener('touchmove', e => {
        if (lastTouchY === null || e.touches.length !== 1) return;
        const x = e.touches[0].clientX;
        const y = e.touches[0].clientY;
        const dx = x - lastTouchX;
        const dy = y - lastTouchY;
        swipeX += dx;
        swipeY += dy;
        touchSamples.push({y, t:performance.now()});
        const cutoff = performance.now() - 125;
        while (touchSamples.length > 2 && touchSamples[0].t < cutoff) touchSamples.shift();
        // Direct finger tracking preserved for deliberate, slow gestures.
        if (!completed && Math.abs(swipeY) > Math.abs(swipeX)) {
          if (e.cancelable) e.preventDefault();
          changeProgress(-dy / (viewportHeight * .7));
        }
        lastTouchX = x; lastTouchY = y;
      }, {passive:false});
      scene.addEventListener('touchend', e => {
        const horizontal = Math.abs(swipeX) > 55 && Math.abs(swipeX) > Math.abs(swipeY) * 1.25;
        if (horizontal) {
          lastSwipeAt = performance.now();
          changeSlide(swipeX < 0 ? 1 : -1);
        } else if (!completed && swipeY < -FLICK_DISTANCE && Math.abs(swipeY) > Math.abs(swipeX) * 1.25) {
          const first = touchSamples[0];
          const last = touchSamples[touchSamples.length - 1];
          const upwardVelocity = first && last ? (first.y - last.y) / Math.max(1, last.t - first.t) : 0;
          if (upwardVelocity >= FLICK_VELOCITY) {
            // Strong upward throw: travel all the way, decelerating to final logo.
            animateIntroTo(1, 650 + (1-progress)*250);
          } else if (upwardVelocity > 0.12) {
            // Gentler release: slight momentum without auto-finishing the logo.
            animateIntroTo(Math.min(.97, progress + upwardVelocity * .15), 260);
          }
        }
        touchSamples = [];
        lastTouchX = lastTouchY = null;
      }, {passive:true});
      scene.addEventListener('touchcancel', () => {
        touchSamples = [];
        lastTouchX = lastTouchY = null;
      }, {passive:true});
      window.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
          e.preventDefault(); changeSlide(e.key === 'ArrowRight' ? 1 : -1); return;
        }
        if (!completed && ['ArrowDown', 'PageDown', ' ', 'ArrowUp', 'PageUp', 'End'].includes(e.key)) {
          e.preventDefault();
          changeProgress(e.key === 'End' ? 1 : (e.key === 'ArrowUp' || e.key === 'PageUp' ? -.5 : .5));
        }
      });
      window.addEventListener('resize', () => layout(false));
      // Exposed for simple automated verification, not for the visitor UI.
      window.__dagoPreview = {
        getActivePhoto: () => slideIndex,
        getSlideCount: () => slides.length,
        getSlideProgress: () => clamp((performance.now()-slideStartedAt)/interval,0,1),
        getMobileIconLocations: () => [document.querySelector('.cross').getBoundingClientRect().top, document.querySelector('.circle').getBoundingClientRect().top],
        getLogoComplete: () => completed,
        getLogoProgress: () => progress,
        getIntroVariant: () => introVariant,
        chooseIntroVariant: mode => chooseIntroVariant(mode),
        getLetterJitterRatio: () => introVariant === 'grouped-plus' ? GROUPED_PLUS_LETTER_JITTER : GROUPED_LETTER_JITTER,
        getIntroModes: () => ['scattered', 'grouped', 'grouped-plus'],
        getCursorDirection: () => cursorArrow.dataset.direction,
        nextPhoto: () => changeSlide(1),
        previousPhoto: () => changeSlide(-1)
      };
      layout(true);
    })();
  </script>
</body>
</html>
