<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>STUDIO DAGO — Plane</title>
<style>
:root{
 --ui-bg:#fcfcfb;--stage:#fff;--ink:#000;--muted:#000;--line:#e7e7e4;
 --pill:#d8d8d8;--pill-hover:#c6c6c6;--type:12.6px;--unit:46px;
 --font:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:var(--type);line-height:1.15;font-weight:700;color:var(--ink);background:var(--ui-bg);overflow:hidden;text-transform:uppercase}
button,input{font-family:inherit;font-size:inherit;text-transform:inherit}
button{ -webkit-tap-highlight-color:transparent }
.workspace{display:grid;grid-template-columns:318px minmax(0,1fr);height:100dvh;min-height:470px;width:100%}
.sidebar{
 background:var(--ui-bg);border-right:1px solid var(--line);z-index:2;
 display:flex;flex-direction:column;padding:18px 14px 18px;
 min-height:0;overflow-y:auto;gap:0;
}
.brand{
 display:flex;justify-content:flex-start;align-items:center;min-height:var(--unit);
 background:transparent;border-radius:0;padding:4px 12px;
}
.brand-logo{display:block;width:205px;max-width:100%;height:auto;pointer-events:none}
.menu{padding-top:20px;display:flex;flex-direction:column;gap:18px}
.section{display:flex;flex-direction:column;gap:6px}
.head{
 display:flex;align-items:center;justify-content:space-between;
 margin-bottom:2px;padding-left:12px;
 font-size:var(--type);font-weight:700;letter-spacing:-.04em;text-transform:uppercase;color:var(--ink);
}
/* Rounded slider and palette rows mirror the floating Spin toolbar. */
.range-wrap,.color-row{
 display:flex;align-items:center;flex-wrap:nowrap;gap:8px;
 min-height:var(--unit);width:100%;padding:0 12px;
 border-radius:999px;background:var(--pill);
}
.range-wrap .name,.color-row .name{
 font-size:var(--type);font-weight:700;letter-spacing:-.045em;white-space:nowrap;flex:none;
}
.range-wrap .name{min-width:70px}
.range-wrap .tiny{
 font-size:var(--type);font-weight:700;letter-spacing:-.045em;
 font-variant-numeric:tabular-nums;white-space:nowrap;flex:none;text-align:right;
}
.range-wrap .range{min-width:30px;flex:1 1 0}
.range{
 display:block;appearance:none;-webkit-appearance:none;background:transparent;
 height:24px;margin:0;border:0;padding:0;cursor:pointer;touch-action:manipulation;
}
.range::-webkit-slider-runnable-track{height:2px;background:#181a16;border-radius:2px}
.range::-moz-range-track{height:2px;background:#181a16;border-radius:2px}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-6px;background:#1c1e1b;border:0;border-radius:50%}
.range::-moz-range-thumb{width:14px;height:14px;background:#1c1e1b;border:0;border-radius:50%}
.range:focus-visible{outline:2px solid #20211e;outline-offset:3px}
.divider{display:none}
.color-row{justify-content:space-between}
.swatches{display:flex;gap:6px;align-items:center;padding:4px 2px;flex:none}
.swatch{
 width:22px;height:22px;flex:none;border-radius:50%;border:1px solid #bcbcb9;
 cursor:pointer;position:relative;padding:0;background:var(--swatch);
}
.swatch.active:after{content:"";position:absolute;inset:-4px;border:1.5px solid #1d1d1b;border-radius:50%;pointer-events:none}
.picker-shell{
 display:block;position:relative;width:22px;height:22px;flex:none;border-radius:50%;
 background:conic-gradient(#ff4343,#ffdd66,#5de5a6,#3987ff,#be6cf5,#ff4343);
 border:1px solid #bcbcb9;cursor:pointer;
}
.picker-shell:before{content:"";position:absolute;inset:6px;background:var(--picked,var(--ui-bg));border-radius:50%;pointer-events:none}
.picker-shell.active:after{content:"";position:absolute;inset:-4px;border:1.5px solid #1d1d1b;border-radius:50%;pointer-events:none}
.picker-shell input{position:absolute;inset:-4px;width:30px;height:30px;opacity:0;cursor:pointer}
.swatch:focus-visible,.picker-shell:focus-within{outline:2px solid #20211e;outline-offset:4px}
.bottom{
 margin-top:auto;padding:22px 12px 0;
 display:flex;flex-direction:column;align-items:flex-start;gap:11px;
}
.text-action{
 appearance:none;display:inline-block;width:auto;height:auto;margin:0;padding:0;border:0;
 border-radius:0;background:none;box-shadow:none;color:#000;
 font-size:var(--type);line-height:1.2;font-weight:700;letter-spacing:-.045em;
 text-align:left;text-decoration:none;text-underline-offset:4px;cursor:pointer;
}
.text-action:hover{text-decoration:underline;color:#20211e}
.text-action:focus-visible{outline:2px solid #20211e;outline-offset:4px}
.text-action:disabled{cursor:default;text-decoration:none}
.stage{
 position:relative;min-width:0;overflow:hidden;touch-action:none;cursor:pointer;
 background:var(--stage);container-type:inline-size;
}
.stage.dragging{cursor:grabbing}
.stage canvas{display:none}
.stage:focus-visible{outline:2px solid #999;outline-offset:-2px}
.scene3d{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
.scene3d .pivot{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.scene3d .blade{position:absolute;top:0;left:0;transform-style:preserve-3d;backface-visibility:visible}
.scene3d .blade img{display:block;width:100%;height:100%;backface-visibility:visible;user-select:none;-webkit-user-drag:none}
.canvas-actions{
 position:absolute;z-index:5;bottom:22px;left:50%;transform:translateX(-50%);
 display:flex;align-items:stretch;gap:0;padding:0;border:0;box-shadow:none;background:none;
 max-width:calc(100% - 24px);height:var(--unit);color:#000;touch-action:pan-x;
}
.canvas-motion,.motion-field,.direction-button{background:var(--pill);border:0;border-radius:999px}
.canvas-motion{
 flex:0 0 102px;width:102px;height:var(--unit);padding:0 12px;
 color:#000;font-size:var(--type);line-height:1;font-weight:700;
 letter-spacing:-.035em;text-transform:uppercase;cursor:pointer;
 transition:background .16s ease;touch-action:manipulation;
}
.canvas-motion:hover{background:var(--pill-hover)}
.canvas-motion:active,.canvas-motion.on{background:#bcbcbc}
.canvas-motion:focus-visible,.direction-button:focus-visible{outline:2px solid #1d1d1b;outline-offset:-5px}
.motion-field{
 display:flex;align-items:center;flex-flow:row nowrap;gap:9px;min-width:0;height:var(--unit);
 padding:0 12px;white-space:nowrap;
}
.motion-field.turns-field{flex:0 1 192px;width:192px}
.motion-field.duration-field{flex:0 1 190px;width:190px}
.motion-field .name,.motion-field .tiny{
 margin:0;color:#000;font-size:var(--type);line-height:1;font-weight:700;
 letter-spacing:-.055em;text-transform:uppercase;white-space:nowrap;
}
.motion-field .range{width:30px;min-width:30px;flex:1 1 auto}
.motion-direction{display:flex;align-items:center;flex:none;height:var(--unit)}
.motion-direction .name{
 position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
 clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
.direction-buttons{display:flex;align-items:stretch;gap:0;height:100%}
.direction-button{
 display:grid;place-items:center;width:var(--unit);height:var(--unit);flex:0 0 var(--unit);padding:0;
 color:#151614;font-size:var(--type);line-height:1;font-weight:700;
 cursor:pointer;transition:background .16s ease,color .16s ease;
}
.direction-button:hover{background:#c4c4c4;color:#000}
.direction-button.active{background:#21221f;color:#fff}
.direction-button.active:hover{background:#3a3b37;color:#fff}
.corner{display:none}
/* The controls wrap only when the canvas no longer accommodates five wide capsules. */
@container (max-width:625px){
 .canvas-actions{
  width:min(440px,calc(100% - 24px));height:auto;bottom:16px;
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;
 }
 .canvas-motion{grid-column:1/3;grid-row:1;width:100%;height:46px;flex-basis:auto}
 .motion-direction{grid-column:3/5;grid-row:1;height:46px;width:100%}
 .direction-buttons{width:100%;gap:4px}
 .direction-button{width:auto;height:46px;flex:1 1 0}
 .motion-field{height:46px;gap:9px;padding:0 13px}
 .motion-field.turns-field{grid-column:1/-1;grid-row:2;width:100%;flex-basis:auto}
 .motion-field.duration-field{grid-column:1/-1;grid-row:3;width:100%;flex-basis:auto}
}
@media(max-width:920px) and (min-width:701px){
 .workspace{grid-template-columns:292px minmax(0,1fr)}
 .sidebar{padding:15px 10px}
 .menu{padding-top:18px;gap:16px}
 .brand-logo{width:194px}
 .range-wrap,.color-row{padding:0 11px;gap:7px}
 .range-wrap .name{min-width:69px}
 .swatches{gap:5px}
 .swatch,.picker-shell{width:22px;height:22px}
}
/* On phones the work stays centered while a three-page control deck is docked below. */
.mobile-dock{display:none}
@media(max-width:700px){
 html,body{height:100%;overflow:hidden;overscroll-behavior:none}
 .workspace{display:block;width:100%;height:100dvh;min-height:0}
 .stage{display:block;height:100dvh;min-height:0;width:100%;touch-action:none}
 .sidebar{display:none}
 .mobile-dock{
  display:flex;position:fixed;z-index:20;left:0;right:0;bottom:0;
  flex-direction:column;gap:0;max-width:100%;
  padding:9px 10px max(13px,env(safe-area-inset-bottom));
  background:linear-gradient(to bottom,rgba(252,252,251,0),rgba(252,252,251,.95) 27%,#fcfcfb 65%);
 }
 .mobile-dots{display:flex;align-items:center;justify-content:center;gap:7px;height:26px;margin-bottom:5px}
 .mobile-dot{appearance:none;width:11px;height:11px;border:0;padding:0;border-radius:50%;background:#d3d3d3;cursor:pointer;touch-action:manipulation;transition:background .15s ease}
 .mobile-dot.active{background:#050505}
 .mobile-dot:focus-visible{outline:2px solid #000;outline-offset:3px}
 .mobile-pages{
  display:flex;flex:0 0 auto;width:100%;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;scroll-behavior:smooth;
  scrollbar-width:none;-ms-overflow-style:none;
  overscroll-behavior-x:contain;touch-action:pan-x;
 }
 .mobile-pages::-webkit-scrollbar{display:none}
 .mobile-page{display:flex;flex-direction:column;justify-content:flex-end;width:100%;flex:0 0 100%;min-width:0;min-height:148px;scroll-snap-align:start;scroll-snap-stop:always;padding:0;}
 .mobile-page .section{gap:5px}
 .mobile-page .head{margin:0 0 3px;padding-left:12px}
 .mobile-page .range-wrap,.mobile-page .color-row{height:var(--unit);min-height:var(--unit);padding:0 12px}
 .mobile-page .menu{padding:0}
 .mobile-page .bottom{
  display:flex;flex-flow:row wrap;align-items:center;justify-content:space-between;
  margin-top:14px;padding:4px 12px 0;gap:8px 10px;
 }
 .mobile-page .bottom .text-action{font-size:var(--type);white-space:nowrap;}
 .mobile-page .canvas-actions{
  position:static;left:auto;bottom:auto;transform:none;
  width:100%;max-width:none;height:auto;display:grid;
  grid-template-columns:minmax(0,1fr) var(--unit) var(--unit);
  grid-template-rows:repeat(3,var(--unit));gap:5px;
  color:#000;touch-action:auto;
 }
 .mobile-page .canvas-motion{grid-column:1;grid-row:1;width:100%;height:var(--unit);flex-basis:auto}
 .mobile-page .motion-direction{grid-column:2/4;grid-row:1;width:100%;height:var(--unit)}
 .mobile-page .direction-buttons{width:100%;height:100%;gap:5px}
 .mobile-page .direction-button{width:var(--unit);height:var(--unit);flex:1 1 0;}
 .mobile-page .motion-field{width:100%;min-width:0;height:var(--unit);gap:9px;padding:0 12px;flex-basis:auto}
 .mobile-page .motion-field.turns-field{grid-column:1/-1;grid-row:2;width:100%;flex-basis:auto}
 .mobile-page .motion-field.duration-field{grid-column:1/-1;grid-row:3;width:100%;flex-basis:auto}
 .mobile-page .motion-field .range{width:30px;min-width:30px;flex:1 1 auto}
 .mobile-page .swatches{gap:6px}
 .mobile-page .color-row .name{white-space:nowrap}
 .mobile-page .color-row{justify-content:space-between}
 .mobile-page .range-wrap .name{min-width:75px}
}
@media(max-width:400px){
 .mobile-dock{padding-left:10px;padding-right:10px}
 .mobile-page .range-wrap,.mobile-page .color-row{padding:0 12px}
 .mobile-page .swatches{gap:6px}
 .mobile-page .swatch,.mobile-page .picker-shell{width:22px;height:22px}
 .mobile-page .bottom{gap:8px 10px}
 .mobile-page .range-wrap .name{min-width:70px}
}
</style>
</head>
<body>
<div class="workspace">
<aside class="sidebar">
  <div class="brand" aria-label="STUDIO DAGO"><img class="brand-logo" id="brandLogo" alt="STUDIO DAGO" /></div>
  <div class="menu">
    <section class="section">
      <div class="head"><span>Composizione</span></div>
      <div class="range-wrap"><label for="elements" class="name">Elementi</label><input class="range" id="elements" type="range" min="1" max="10" step="1" value="1" aria-label="Elementi"><span class="tiny" id="elementsVal">1</span></div>
      <div class="range-wrap"><label for="spread" class="name">Distanza</label><input class="range" id="spread" type="range" min="0" max="360" step="1" value="120" aria-label="Distanza"><span class="tiny" id="spreadVal">120°</span></div>
    </section>
    <div class="divider"></div>
    <section class="section">
      <div class="head"><span>Colori</span></div>
      <div class="color-row">
        <span class="name">Sfondo</span>
        <div class="swatches" id="bgSwatches" role="group" aria-label="Colore dello sfondo">
          <button type="button" class="swatch" data-bg="#000000" style="--swatch:#000000" aria-label="Sfondo nero" aria-pressed="false" title="Nero"></button>
          <button type="button" class="swatch" data-bg="#808080" style="--swatch:#808080" aria-label="Sfondo grigio" aria-pressed="false" title="Grigio"></button>
          <button type="button" class="swatch active" data-bg="#ffffff" style="--swatch:#ffffff" aria-label="Sfondo bianco" aria-pressed="true" title="Bianco"></button>
          <label class="picker-shell" id="bgPickerShell" title="Altro colore per lo sfondo" aria-label="Altro colore per lo sfondo"><input type="color" id="bgPicker" value="#ffffff" aria-label="Scegli un colore personalizzato per lo sfondo"></label>
        </div>
      </div>
      <div class="color-row">
        <span class="name">Logo</span>
        <div class="swatches" id="logoSwatches" role="group" aria-label="Colore del logo">
          <button type="button" class="swatch active" data-logo="#000000" style="--swatch:#000000" aria-label="Logo nero" aria-pressed="true" title="Nero"></button>
          <button type="button" class="swatch" data-logo="#808080" style="--swatch:#808080" aria-label="Logo grigio" aria-pressed="false" title="Grigio"></button>
          <button type="button" class="swatch" data-logo="#ffffff" style="--swatch:#ffffff" aria-label="Logo bianco" aria-pressed="false" title="Bianco"></button>
          <label class="picker-shell" id="logoPickerShell" title="Altro colore per il logo" aria-label="Altro colore per il logo"><input type="color" id="logoPicker" value="#000000" aria-label="Scegli un colore personalizzato per il logo"></label>
        </div>
      </div>
    </section>
  </div>
  <div class="bottom">
    <button type="button" class="text-action" id="reset">Reimposta vista</button>
    <button type="button" class="text-action" id="export">Save SVG</button>
    <button type="button" class="text-action" id="exportVideo"><span id="exportVideoLabel">Esporta MP4</span></button>
  </div>
</aside>
<main class="stage" id="stage" tabindex="0" aria-label="Canvas interattivo: clicca ovunque per un flip di 180 gradi, trascina per cambiare prospettiva">
  <div class="canvas-actions" id="canvasActions" role="group" aria-label="Controlli Spin">
    <button type="button" class="canvas-motion" id="motion" aria-label="Avvia Spin">Spin</button>
    <div class="motion-field turns-field">
      <label for="turns" class="name">Giri</label>
      <input class="range" id="turns" type="range" min="1" max="5" step="1" value="5" aria-label="Numero di giri dello Spin">
      <span class="tiny" id="turnsVal" aria-live="off">5</span>
    </div>
    <div class="motion-field duration-field">
      <label for="duration" class="name">Durata</label>
      <input class="range" id="duration" type="range" min="4" max="16" step="1" value="8" aria-label="Durata dello Spin">
      <span class="tiny" id="durationVal" aria-live="off">8 s</span>
    </div>
    <div class="motion-direction" aria-label="Direzione Spin">
      <span class="name" id="directionLabel">Direzione</span>
      <div class="direction-buttons" role="group" aria-labelledby="directionLabel" id="directionButtons">
        <button type="button" class="direction-button active" data-direction="right" aria-label="Da sinistra a destra" aria-pressed="true" title="Sinistra → destra">→</button>
        <button type="button" class="direction-button" data-direction="left" aria-label="Da destra a sinistra" aria-pressed="false" title="Destra → sinistra">←</button>
      </div>
    </div>
  </div>
</main>
<nav class="mobile-dock" id="mobileDock" aria-label="Pannelli di controllo">
  <div class="mobile-dots" role="tablist" aria-label="Pannelli">
    <button type="button" class="mobile-dot active" data-page="0" role="tab" aria-label="Spin" aria-selected="true" aria-controls="mobilePageMotion"></button>
    <button type="button" class="mobile-dot" data-page="1" role="tab" aria-label="Composizione" aria-selected="false" aria-controls="mobilePageComposition"></button>
    <button type="button" class="mobile-dot" data-page="2" role="tab" aria-label="Colori ed esportazione" aria-selected="false" aria-controls="mobilePageColors"></button>
  </div>
  <div class="mobile-pages" id="mobilePages">
    <div class="mobile-page" id="mobilePageMotion" role="tabpanel" aria-label="Spin"></div>
    <div class="mobile-page" id="mobilePageComposition" role="tabpanel" aria-label="Composizione"></div>
    <div class="mobile-page" id="mobilePageColors" role="tabpanel" aria-label="Colori ed esportazione"></div>
  </div>
</nav>
</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const stage=$('stage');
// Keep exactly one set of live controls. Move it to the mobile slide deck
// at 700px and return it to its original desktop positions above that size.
const mobileMQ=window.matchMedia('(max-width:700px)');
const desktopMenu=document.querySelector('.sidebar .menu');
const desktopBottom=document.querySelector('.sidebar .bottom');
const composeSection=desktopMenu.querySelectorAll('.section')[0];
const colorsSection=desktopMenu.querySelectorAll('.section')[1];
const desktopActions=$('canvasActions');
const mobilePages=$('mobilePages');
const mobileDots=Array.from(document.querySelectorAll('.mobile-dot'));
let currentMobilePage=0;
function activateMobilePage(index){
 currentMobilePage=Math.max(0,Math.min(2,index));
 mobileDots.forEach((dot,i)=>{
  const active=i===currentMobilePage;
  dot.classList.toggle('active',active);
  dot.setAttribute('aria-selected',String(active));
  dot.tabIndex=active?0:-1;
 });
}
function goMobilePage(index){
 activateMobilePage(index);
 mobilePages.scrollTo({left:mobilePages.clientWidth*currentMobilePage,behavior:'smooth'});
}
mobileDots.forEach(dot=>dot.addEventListener('click',()=>goMobilePage(Number(dot.dataset.page))));
let pageScrollTick=false;
mobilePages.addEventListener('scroll',()=>{
 if(pageScrollTick)return;
 pageScrollTick=true;
 requestAnimationFrame(()=>{
  pageScrollTick=false;
  if(mobilePages.clientWidth)activateMobilePage(Math.round(mobilePages.scrollLeft/mobilePages.clientWidth));
 });
},{passive:true});
function arrangeControls(){
 if(mobileMQ.matches){
  $('mobilePageMotion').appendChild(desktopActions);
  $('mobilePageComposition').appendChild(composeSection);
  $('mobilePageColors').appendChild(colorsSection);
  $('mobilePageColors').appendChild(desktopBottom);
  // Returning to a mobile viewport should always open with the Spin controls.
  goMobilePage(0);
 }else{
  stage.appendChild(desktopActions);
  desktopMenu.appendChild(composeSection);
  desktopMenu.appendChild(colorsSection);
  document.querySelector('.sidebar').appendChild(desktopBottom);
  mobilePages.scrollLeft=0;
  activateMobilePage(0);
 }
}

arrangeControls();

function muxMP4(chunks,avcC,width,height,fps){

 const movieDuration=Math.round(chunks.length*1000/fps);
 const ftyp=box('ftyp',ascii('isom'),be32(512),ascii('isomiso2avc1mp41'));
 const payload=concat(...chunks.map(c=>c.data));
 const mdat=box('mdat',payload);
 const avc1=box('avc1',bytes(0,0,0,0,0,0),be16(1),new Uint8Array(16),be16(width),be16(height),be32(0x00480000),be32(0x00480000),be32(0),be16(1),new Uint8Array(32),be16(24),be16(65535),box('avcC',avcC));
 const stsd=full('stsd',0,be32(1),avc1);
 const stts=full('stts',0,be32(1),be32(chunks.length),be32(sampleDuration));
 const stsc=full('stsc',0,be32(1),be32(1),be32(chunks.length),be32(1));
 const stsz=full('stsz',0,be32(0),be32(chunks.length),...chunks.map(c=>be32(c.data.length)));
 const stco=full('stco',0,be32(1),be32(ftyp.length+8));
 const keyframes=chunks.map((c,i)=>c.key?i+1:0).filter(Boolean);
 const stss=full('stss',0,be32(keyframes.length),...keyframes.map(be32));
 const stbl=box('stbl',stsd,stts,stsc,stsz,stco,stss);
 const dinf=box('dinf',full('dref',0,be32(1),full('url ',1)));
 const minf=box('minf',full('vmhd',1,be16(0),new Uint8Array(6)),dinf,stbl);
 const mdhd=full('mdhd',0,be32(0),be32(0),be32(timescale),be32(mediaDuration),be16(0x55c4),be16(0));
 const hdlr=full('hdlr',0,be32(0),ascii('vide'),new Uint8Array(12),ascii('VideoHandler\0'));
 const mdia=box('mdia',mdhd,hdlr,minf);
 const tkhd=full('tkhd',7,be32(0),be32(0),be32(1),be32(0),be32(movieDuration),new Uint8Array(8),be16(0),be16(0),be16(0),be16(0),unity,be32(width*65536),be32(height*65536));
 const trak=box('trak',tkhd,mdia);
 const mvhd=full('mvhd',0,be32(0),be32(0),be32(1000),be32(movieDuration),be32(65536),be16(256),new Uint8Array(10),unity,new Uint8Array(24),be32(2));
 return new Blob([ftyp,mdat,box('moov',mvhd,trak)],{type:'video/mp4'});
}
function encodeSettings(width,height){return {codec:'avc1.42001f',width,height,bitrate:2600000,framerate:30,latencyMode:'realtime',avc:{format:'avc'}};}
function sizeForVideo(){const r=stage.getBoundingClientRect(),ratio=Math.min(1.5,1280/r.width,1280/r.height);
 const width=Math.max(2,Math.round(r.width*ratio/2)*2),height=Math.max(2,Math.round(r.height*ratio/2)*2);return {width,height};}
const videoBtn=$('exportVideo'),videoLabel=$('exportVideoLabel');
function yieldUI(){return new Promise(resolve=>setTimeout(resolve,0));}
async function exportWithWebCodecs(canvas,ctx,view,frameCount,fps){
 const {width,height}=canvas,config=encodeSettings(width,height);
 if(!(await VideoEncoder.isConfigSupported(config)).supported)throw Error('Codifica H.264 non disponibile');
 const chunks=[];let avcC=null,encodingError=null;
 const encoder=new VideoEncoder({output:(chunk,meta)=>{
  if(meta?.decoderConfig?.description)avcC=new Uint8Array(meta.decoderConfig.description);
  const data=new Uint8Array(chunk.byteLength);chunk.copyTo(data);
  chunks.push({timestamp:chunk.timestamp,data,key:chunk.type==='key'});
 },error:e=>{encodingError=e;}});
 try{
  encoder.configure(config);
  for(let i=0;i<frameCount;i++){
   if(encodingError)throw encodingError;
   renderToCanvas(ctx,width,height,'video',applyMotionAt(view,(i/fps)/view.duration));
   const frame=new VideoFrame(canvas,{timestamp:Math.round(i*1000000/fps),duration:Math.round(1000000/fps)});
   encoder.encode(frame,{keyFrame:i%60===0});frame.close();
   if(i%5===0){videoLabel.textContent='Esportazione '+Math.round(i/frameCount*100)+'%';await yieldUI();}
   if(encoder.encodeQueueSize>15)await encoder.flush();
  }
  await encoder.flush();if(encodingError)throw encodingError;
 }finally{encoder.close();}
 chunks.sort((a,b)=>a.timestamp-b.timestamp);
 if(!avcC||!chunks.length)throw Error('Dati H.264 mancanti');
 return muxMP4(chunks,avcC,width,height,fps);
}
async function exportWithMediaRecorder(canvas,ctx,view,frameCount,fps){
 const mime=['video/mp4;codecs=avc1.42E01E','video/mp4;codecs=avc1','video/mp4'].find(t=>MediaRecorder.isTypeSupported(t));
 if(!mime)throw Error('MP4 non supportato');
 const stream=canvas.captureStream(30),chunks=[];
 const recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:2600000});
 const completed=new Promise((resolve,reject)=>{
  recorder.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data);};
  recorder.onerror=e=>reject(e.error||Error('Registrazione non riuscita'));
  recorder.onstop=()=>resolve(new Blob(chunks,{type:'video/mp4'}));
 });
 recorder.start();let start=performance.now(),stopped=false;
 try{
  await new Promise(resolve=>{
   function tick(now){
    const elapsed=Math.min(frameCount/fps,(now-start)/1000);
    renderToCanvas(ctx,canvas.width,canvas.height,'video',applyMotionAt(view,elapsed/view.duration));
    const percent=Math.round(100*elapsed/(frameCount/fps));videoLabel.textContent='Esportazione '+percent+'%';
    if(elapsed<frameCount/fps)requestAnimationFrame(tick);else resolve();
   }requestAnimationFrame(tick);
  });
 }finally{if(recorder.state!=='inactive'){recorder.stop();stopped=true;}stream.getTracks().forEach(t=>t.stop());}
 const output=await completed;if(!output.size)throw Error('Video vuoto');return output;
}
async function exportMP4(){
 if(videoBtn.disabled||!state.image?.complete)return;
 videoBtn.disabled=true;videoBtn.style.opacity='.55';videoLabel.textContent='Esportazione 0%';
 try{
  const {width,height}=sizeForVideo(),canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
  const ctx=canvas.getContext('2d',{alpha:false});const view=currentView();
  // Export whichever motion the user used last (Spin button or logo click).
  view.spin=0;view.spinPitch=0;
  view.motionMode=state.lastMotionMode;
  view.duration=view.motionMode==='flip'?state.flipDuration:state.duration;
  const fps=30,frameCount=Math.ceil((view.duration+.45)*fps);
  let output;
  if(typeof VideoEncoder!=='undefined'&&typeof VideoFrame!=='undefined'){
   try{output=await exportWithWebCodecs(canvas,ctx,view,frameCount,fps);}catch(e){
    if(typeof MediaRecorder==='undefined'||!canvas.captureStream)throw e;
    output=await exportWithMediaRecorder(canvas,ctx,view,frameCount,fps);
   }
  }else if(typeof MediaRecorder!=='undefined'&&canvas.captureStream){output=await exportWithMediaRecorder(canvas,ctx,view,frameCount,fps);}
  else throw Error('Questo browser non può esportare MP4. Usa una versione recente di Chrome, Edge o Safari.');
  download(output,'studio-dago-'+view.motionMode+'.mp4');
 }catch(error){console.error(error);alert('Esportazione MP4 non disponibile: '+(error?.message||'errore sconosciuto'));}
 finally{videoBtn.disabled=false;videoBtn.style.opacity='';videoLabel.textContent='Esporta MP4';}
}
videoBtn.onclick=exportMP4;
// The entire stage is an interaction surface, not just the visible logo.
// Mouse parallax and click-to-flip are canvas-wide; drag still orbits.
const input={
 down:false,dragging:false,id:null,x:0,y:0,startX:0,startY:0,
 lastTime:0,lastMotion:0,velYaw:0,velPitch:0,coastYaw:0,coastPitch:0,
 targetYaw:0,targetPitch:0,hoverYaw:0,hoverPitch:0
};
const clamp=(value,min,max)=>Math.max(min,Math.min(max,value));
function currentView(){return {...state,yaw:state.yaw+input.hoverYaw,pitch:clamp(state.pitch+input.hoverPitch,-MAX_PITCH,MAX_PITCH)};}
function hoverAt(e){
 if(state.spinAnimation)return;
 if(e.pointerType!=='mouse'&&e.pointerType!=='pen')return;
 const r=stage.getBoundingClientRect();
 const x=clamp((e.clientX-r.left)/r.width*2-1,-1,1);
 const y=clamp((e.clientY-r.top)/r.height*2-1,-1,1);
 input.targetYaw=x*.62; // Deliberately visible, up to ~35 degrees on either side.
 input.targetPitch=-y*.095; // About 5 degrees: just enough to suggest three dimensions.
}
stage.addEventListener('pointerenter',e=>{if(!input.down)hoverAt(e);});
stage.addEventListener('pointerleave',()=>{
 if(!input.down){input.targetYaw=0;input.targetPitch=0;}
});
stage.addEventListener('pointerdown',e=>{
 if(e.target.closest('#canvasActions'))return;
 if(e.button!==0&&e.pointerType==='mouse')return;
 input.down=true;input.dragging=false;input.id=e.pointerId;
 input.x=input.startX=e.clientX;input.y=input.startY=e.clientY;
 input.lastTime=performance.now();input.lastMotion=0;
 input.velYaw=0;input.velPitch=0;
 cancelMotion();
 input.coastYaw=0;input.coastPitch=0;
 input.targetYaw=0;input.targetPitch=0;
 stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove',e=>{
 if(!input.down||e.pointerId!==input.id){hoverAt(e);return;}
 const now=performance.now(),dx=e.clientX-input.x,dy=e.clientY-input.y;
 const elapsed=Math.max(.008,Math.min(.12,(now-input.lastTime)/1000));
 input.x=e.clientX;input.y=e.clientY;input.lastTime=now;
 if(!input.dragging&&Math.hypot(input.x-input.startX,input.y-input.startY)<3)return;
 if(!input.dragging){
  input.dragging=true;stage.classList.add('dragging');
  // A throw adds temporary inertia and friction to the manual orientation.
 }
 const deltaYaw=dx*.009,deltaPitch=dy*.0028;
 state.yaw+=deltaYaw;
 const oldPitch=state.pitch;
 state.pitch=clamp(state.pitch+deltaPitch,-MAX_PITCH,MAX_PITCH);
 const actualPitch=state.pitch-oldPitch;
 if(dx||dy){
  const blend=.48;
  input.velYaw=clamp(input.velYaw*(1-blend)+clamp(deltaYaw/elapsed,-22,22)*blend,-22,22);
  input.velPitch=actualPitch===0?0:clamp(input.velPitch*(1-blend)+clamp(actualPitch/elapsed,-1.5,1.5)*blend,-1.5,1.5);
  input.lastMotion=now;
 }
});
function endDrag(e){
 if(!input.down||e.pointerId!==input.id)return;
 const wasDragging=input.dragging;
 const clickedCanvas=!wasDragging&&e.type==='pointerup';
 input.down=false;input.dragging=false;input.id=null;
 stage.classList.remove('dragging');
 if(wasDragging&&e.type==='pointerup'){
  const age=(performance.now()-input.lastMotion)/1000;
  const weight=Math.exp(-Math.max(0,age)*5);
  input.coastYaw=input.velYaw*weight;
  input.coastPitch=input.velPitch*weight;
 }else{input.coastYaw=0;input.coastPitch=0;}
 input.velYaw=0;input.velPitch=0;
 // If the pointer is still inside the canvas, normal parallax resumes.
 const r=stage.getBoundingClientRect();
 if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)hoverAt(e);
 else{input.targetYaw=0;input.targetPitch=0;}
 if(stage.hasPointerCapture(e.pointerId))stage.releasePointerCapture(e.pointerId);
 if(clickedCanvas)startFlip();
}
stage.addEventListener('pointerup',endDrag);
stage.addEventListener('pointercancel',endDrag);
stage.addEventListener('wheel',e=>{
 e.preventDefault();state.zoom=clamp(state.zoom*Math.exp(-e.deltaY*.001),.35,2.5);
},{passive:false});
window.addEventListener('keydown',e=>{
 if((e.key==='Enter'||e.code==='Space')&&document.activeElement===stage){e.preventDefault();startFlip();}
 if(e.key.toLowerCase()==='r'&&!['INPUT','BUTTON'].includes(e.target.tagName))$('reset').click();
});
window.addEventListener('blur',()=>{input.targetYaw=0;input.targetPitch=0;});
window.addEventListener('resize',rebuild);
rebuild();
let last=performance.now();
function loop(now){
 const dt=Math.min(.07,Math.max(0,(now-last)/1000));last=now;
 if(!input.down){
  // Time-based exponential drag gives the momentum a fidget-spinner-like tail.
  if(Math.abs(input.coastYaw)+Math.abs(input.coastPitch)>.002){
   const friction=1.65;
   const decay=Math.exp(-friction*dt);
   // Integral of the decaying angular velocity: stable at any refresh rate.
   const step=(1-decay)/friction;
   state.yaw+=input.coastYaw*step;
   const oldPitch=state.pitch;
   state.pitch=clamp(state.pitch+input.coastPitch*step,-MAX_PITCH,MAX_PITCH);
   if(state.pitch===oldPitch)input.coastPitch=0;
   input.coastYaw*=decay;input.coastPitch*=decay;
  }else{input.coastYaw=0;input.coastPitch=0;}

 }
 if(state.spinAnimation){
  const t=(now-state.spinAnimation.start)/state.spinAnimation.duration;
  state.spin=motionRadians(state.spinAnimation,t);
  state.spinPitch=0;
  if(t>=1){
   // Preserve exactly the finishing viewpoint for Spin or a 180° click flip.
   state.yaw+=state.spin;state.pitch=clamp(state.pitch+state.spinPitch,-MAX_PITCH,MAX_PITCH);
   state.yaw=(state.yaw+Math.PI)%(Math.PI*2);
   if(state.yaw<0)state.yaw+=Math.PI*2;
   state.yaw-=Math.PI;
   // Pitch is deliberately bounded: there is no full X-axis rotation.
   state.spin=0;state.spinPitch=0;state.spinAnimation=null;
   $('motion').classList.remove('on');
  }
 }
 const ease=1-Math.exp(-dt*10.5);
 input.hoverYaw+=(input.targetYaw-input.hoverYaw)*ease;
 input.hoverPitch+=(input.targetPitch-input.hoverPitch)*ease;
 const yaw=state.yaw+state.spin+input.hoverYaw;
 const pitch=clamp(state.pitch+state.spinPitch+input.hoverPitch,-MAX_PITCH,MAX_PITCH);
 pivot.style.transform='rotateX('+pitch+'rad) rotateY('+yaw+'rad)';
  visual.style.transform='scale('+state.zoom+')';
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
